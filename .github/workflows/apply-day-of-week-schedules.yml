name: Apply weekday schedule support

on:
  push:
    branches:
      - feature/day-of-week-schedules
    paths:
      - .github/workflows/apply-day-of-week-schedules.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/day-of-week-schedules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch firmware and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcu/relay/GardenSimpleRelay6.ino')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'static const uint8_t MAX_DAILY_SCHEDULES = 64;\n',
              'static const uint8_t MAX_DAILY_SCHEDULES = 64;\n'
              'static const uint8_t ALL_WEEKDAYS_MASK = 0x7F; // bit 0=Sun ... bit 6=Sat\n'
              'static const char* WEEKDAY_SHORT_NAMES[7] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};\n',
              'weekday constants'
          )

          replace_once(
              'const char FIRMWARE_VERSION[] = "v26-stop-zone-api";',
              'const char FIRMWARE_VERSION[] = "v27-weekday-schedules";',
              'firmware version'
          )

          replace_once(
              'struct DailySchedule {\n  bool enabled;\n  uint8_t zoneIndex;',
              'struct DailySchedule {\n  bool enabled;\n  uint8_t daysMask;\n  uint8_t zoneIndex;',
              'schedule days field'
          )

          replace_once(
              'bool addDailySchedule(uint8_t zoneIndex, uint8_t hour, uint8_t minute, uint16_t runMinutes, bool enabled = true);',
              'bool addDailySchedule(uint8_t zoneIndex, uint8_t hour, uint8_t minute, uint16_t runMinutes, bool enabled = true, uint8_t daysMask = ALL_WEEKDAYS_MASK);',
              'schedule declaration'
          )

          helpers = r'''
uint8_t normalizeDaysMask(int value) {
  return (uint8_t)(value & ALL_WEEKDAYS_MASK);
}

String daysMaskToText(uint8_t daysMask) {
  daysMask = normalizeDaysMask(daysMask);
  if (daysMask == ALL_WEEKDAYS_MASK) return "All";
  if (daysMask == 0x3E) return "Weekdays";
  if (daysMask == 0x41) return "Weekends";
  if (daysMask == 0) return "None";

  String result;
  for (uint8_t day = 0; day < 7; day++) {
    if ((daysMask & (1U << day)) == 0) continue;
    if (result.length() > 0) result += "|";
    result += WEEKDAY_SHORT_NAMES[day];
  }
  return result;
}

uint8_t parseDaysMaskText(String value) {
  value.trim();
  if (value.length() == 0) return ALL_WEEKDAYS_MASK;

  String lower = value;
  lower.toLowerCase();
  if (lower == "all" || lower == "daily" || lower == "everyday" || lower == "every day") return ALL_WEEKDAYS_MASK;
  if (lower == "weekdays" || lower == "weekday") return 0x3E;
  if (lower == "weekends" || lower == "weekend") return 0x41;
  if (lower == "none" || lower == "off" || lower == "disabled") return 0;

  bool numeric = true;
  for (size_t i = 0; i < lower.length(); i++) {
    if (!isDigit(lower.charAt(i))) {
      numeric = false;
      break;
    }
  }
  if (numeric) return normalizeDaysMask(lower.toInt());

  lower.replace("|", " ");
  lower.replace(",", " ");
  lower.replace("+", " ");
  lower.replace(";", " ");
  lower.replace("/", " ");

  uint8_t mask = 0;
  while (lower.length() > 0) {
    lower.trim();
    if (lower.length() == 0) break;
    int split = lower.indexOf(' ');
    String token = split >= 0 ? lower.substring(0, split) : lower;
    lower = split >= 0 ? lower.substring(split + 1) : "";
    token.trim();

    if (token.startsWith("sun")) mask |= 1U << 0;
    else if (token.startsWith("mon")) mask |= 1U << 1;
    else if (token.startsWith("tue")) mask |= 1U << 2;
    else if (token.startsWith("wed")) mask |= 1U << 3;
    else if (token.startsWith("thu")) mask |= 1U << 4;
    else if (token.startsWith("fri")) mask |= 1U << 5;
    else if (token.startsWith("sat")) mask |= 1U << 6;
  }
  return mask;
}

uint8_t daysMaskFromJson(JsonObject item) {
  if (!item["daysMask"].isNull()) return normalizeDaysMask(item["daysMask"].as<int>());
  if (item["days"].is<const char*>()) return parseDaysMaskText(item["days"].as<String>());
  if (item["days"].is<JsonArray>()) {
    uint8_t mask = 0;
    for (JsonVariant day : item["days"].as<JsonArray>()) mask |= parseDaysMaskText(day.as<String>());
    return normalizeDaysMask(mask);
  }
  return ALL_WEEKDAYS_MASK;
}

void addDaysJson(JsonObject scheduleObject, uint8_t daysMask) {
  daysMask = normalizeDaysMask(daysMask);
  scheduleObject["daysMask"] = daysMask;
  scheduleObject["daysLabel"] = daysMaskToText(daysMask);
  JsonArray days = scheduleObject.createNestedArray("days");
  for (uint8_t day = 0; day < 7; day++) {
    if (daysMask & (1U << day)) days.add(WEEKDAY_SHORT_NAMES[day]);
  }
}

bool scheduleRunsOnWeekday(const DailySchedule& schedule, int weekDay) {
  if (weekDay < 0 || weekDay > 6) return false;
  return (normalizeDaysMask(schedule.daysMask) & (1U << weekDay)) != 0;
}

'''
