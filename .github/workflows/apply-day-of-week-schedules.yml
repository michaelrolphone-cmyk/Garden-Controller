        String timeText = line.substring(c1 + 1, c2);
        String durationText = c3 > c2 ? line.substring(c2 + 1, c3) : line.substring(c2 + 1);
        String enabledText = c3 > c2 ? line.substring(c3 + 1) : "on";
        timeText.trim();
        durationText.trim();
        enabledText.trim();
        enabledText.toLowerCase();''',
              '''      int c1 = line.indexOf(',');
      int c2 = c1 >= 0 ? line.indexOf(',', c1 + 1) : -1;
      int c3 = c2 >= 0 ? line.indexOf(',', c2 + 1) : -1;
      int c4 = c3 >= 0 ? line.indexOf(',', c3 + 1) : -1;

      if (c1 > 0 && c2 > c1) {
        int zoneNumber = line.substring(0, c1).toInt();
        String timeText = line.substring(c1 + 1, c2);
        String durationText = c3 > c2 ? line.substring(c2 + 1, c3) : line.substring(c2 + 1);
        String enabledText = c3 > c2 ? (c4 > c3 ? line.substring(c3 + 1, c4) : line.substring(c3 + 1)) : "on";
        String daysText = c4 > c3 ? line.substring(c4 + 1) : "All";
        timeText.trim();
        durationText.trim();
        enabledText.trim();
        enabledText.toLowerCase();
        daysText.trim();''',
              'schedule text parser fields'
          )

          replace_once(
              '            addDailySchedule((uint8_t)(zoneNumber - 1), h, m, (uint16_t)constrain(runMinutes, 1, 240), enabled);',
              '            addDailySchedule((uint8_t)(zoneNumber - 1), h, m, (uint16_t)constrain(runMinutes, 1, 240), enabled, parseDaysMaskText(daysText));',
              'schedule text parser mask'
          )

          replace_once(
              '      prefs.putUShort((p + "dur").c_str(), dailySchedules[i].runMinutes);',
              '      prefs.putUShort((p + "dur").c_str(), dailySchedules[i].runMinutes);\n      prefs.putUChar((p + "days").c_str(), normalizeDaysMask(dailySchedules[i].daysMask));',
              'persist days mask'
          )

          replace_once(
              '    uint16_t dur = prefs.getUShort((p + "dur").c_str(), 10);\n    addDailySchedule(zoneIndex, hour, minute, dur, enabled);',
              '    uint16_t dur = prefs.getUShort((p + "dur").c_str(), 10);\n    uint8_t daysMask = normalizeDaysMask(prefs.getUChar((p + "days").c_str(), ALL_WEEKDAYS_MASK));\n    addDailySchedule(zoneIndex, hour, minute, dur, enabled, daysMask);',
              'load days mask'
          )

          replace_once(
