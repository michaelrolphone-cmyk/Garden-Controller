          test_path = Path('test/weekday-schedule.test.js')
          test_path.write_text(r'''const fs = require('fs');
const path = require('path');

describe('relay firmware weekday scheduling', () => {
  const ino = fs.readFileSync(path.join(__dirname, '..', 'mcu', 'relay', 'GardenSimpleRelay6.ino'), 'utf8');

  test('stores a seven-bit weekday mask on every schedule', () => {
    expect(ino).toContain('static const uint8_t ALL_WEEKDAYS_MASK = 0x7F;');
    expect(ino).toContain('uint8_t daysMask;');
    expect(ino).toContain('prefs.putUChar((p + "days").c_str()');
    expect(ino).toContain('prefs.getUChar((p + "days").c_str(), ALL_WEEKDAYS_MASK)');
  });

  test('defaults old schedules and API payloads to all days', () => {
    expect(ino).toContain('return ALL_WEEKDAYS_MASK;');
    expect(ino).toContain('uint8_t daysMask = ALL_WEEKDAYS_MASK');
    expect(ino).toContain('String daysText = c4 > c3 ? line.substring(c4 + 1) : "All";');
  });

  test('gates automatic execution by local tm_wday', () => {
    expect(ino).toContain('scheduleRunsOnWeekday(s, t.tm_wday)');
    expect(ino).toContain('(1U << weekDay)');
  });

  test('publishes and accepts weekday fields over JSON', () => {
    expect(ino).toContain('scheduleObject["daysMask"] = daysMask;');
    expect(ino).toContain('scheduleObject["daysLabel"] = daysMaskToText(daysMask);');
    expect(ino).toContain('JsonArray days = scheduleObject.createNestedArray("days");');
    expect(ino).toContain('uint8_t daysMask = daysMaskFromJson(item);');
  });

  test('exposes editable weekday controls in both local schedule editors', () => {
    expect(ino).toContain("Days: All or Mon|Wed|Fri");
    expect(ino).toContain("title='Days: All, Weekdays, Weekends, or Mon|Wed|Fri'");
    expect(ino).toContain('days:r.children[3].value');
  });
});
''')

          readme = Path('README.md')
