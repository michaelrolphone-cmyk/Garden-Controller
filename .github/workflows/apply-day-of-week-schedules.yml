          replace_once(
              '''async function applyApiSchedules(){const rows=[...document.querySelectorAll('#apiSchedRows .grid')];const schedules=rows.map(r=>({channel:Number(r.children[0].value),startTime:r.children[1].value,durationSeconds:Number(r.children[2].value)*60,enabled:r.children[3].value==='on'}));const res=await fetch('/api/schedules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedules})});if(!res.ok){alert('Failed to apply schedules');return;}alert('Schedules updated');location.reload()}''',
              '''async function applyApiSchedules(){const rows=[...document.querySelectorAll('#apiSchedRows .grid')];const schedules=rows.map(r=>({channel:Number(r.children[0].value),startTime:r.children[1].value,durationSeconds:Number(r.children[2].value)*60,days:r.children[3].value,enabled:r.children[4].value==='on'}));const res=await fetch('/api/schedules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedules})});if(!res.ok){alert('Failed to apply schedules');return;}alert('Schedules updated');location.reload()}''',
