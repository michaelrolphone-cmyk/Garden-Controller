          replace_once(
              '''function addApiScheduleRow(v){const c=document.getElementById('apiSchedRows');const d=document.createElement('div');d.className='grid';d.innerHTML=`<input placeholder=Zone min=1 max=5 type=number value='${(v&&v.zone)||1}'/><input placeholder=HH:MM value='${(v&&v.timeValue)||"06:00"}'/><input placeholder=Minutes min=1 max=240 type=number value='${(v&&v.runMinutes)||10}'/><select><option value='on'>on</option><option value='off'>off</option></select><button type=button onclick='this.parentElement.remove()'>Delete</button>`;if(v&&v.enabled===false){d.querySelector('select').value='off';}c.appendChild(d)}''',
              '''function addApiScheduleRow(v){const c=document.getElementById('apiSchedRows');const d=document.createElement('div');d.className='grid';d.innerHTML=`<input placeholder=Zone min=1 max=5 type=number value='${(v&&v.zone)||1}'/><input placeholder=HH:MM value='${(v&&v.timeValue)||"06:00"}'/><input placeholder=Minutes min=1 max=240 type=number value='${(v&&v.runMinutes)||10}'/><input placeholder='Days: All or Mon|Wed|Fri' value='${(v&&v.daysLabel)||"All"}'/><select><option value='on'>on</option><option value='off'>off</option></select><button type=button onclick='this.parentElement.remove()'>Delete</button>`;if(v&&v.enabled===false){d.querySelector('select').value='off';}c.appendChild(d)}''',
              'legacy API schedule row weekdays'
