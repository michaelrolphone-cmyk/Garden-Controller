              '  return String(s.zoneIndex + 1) + "," + two(s.startHour) + ":" + two(s.startMinute) + "," + String(s.runMinutes) + "," + String(s.enabled ? "on" : "off") + "," + daysMaskToText(s.daysMask);',
              'schedule text output'
          )

          replace_once(
              '''      int c1 = line.indexOf(',');
      int c2 = c1 >= 0 ? line.indexOf(',', c1 + 1) : -1;
      int c3 = c2 >= 0 ? line.indexOf(',', c2 + 1) : -1;

