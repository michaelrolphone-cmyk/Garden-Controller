              'Each line format: <b>zone,HH:MM,minutes,on/off,days</b>. Days may be All, Weekdays, Weekends, a 0-127 mask, or names such as Mon|Wed|Fri. Example: <code>1,06:00,10,on,Weekdays</code>',
