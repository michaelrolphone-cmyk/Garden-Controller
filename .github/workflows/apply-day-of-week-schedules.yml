              '''function addScheduleRow(v){const rows=document.getElementById('adminSchedRows');const row=document.createElement('div');row.className='actions';const z=Number(v&&v.zone||1);const t=(v&&v.timeValue)||'06:00';const m=Number(v&&v.runMinutes||10);const days=(v&&v.daysLabel)||'All';row.innerHTML=`<input type=number min=1 max=5 value='${z}' title='Zone'><input type=time style='max-width:84px' value='${t}' title='Start'><input type=number min=1 max=240 style='max-width:62px' value='${m}' title='Minutes'><input value='${days}' title='Days: All, Weekdays, Weekends, or Mon|Wed|Fri'><input type='hidden' value='on' title='Enabled'><button class='danger' onclick="this.parentElement.remove()">Delete</button>`;rows.appendChild(row)}''',
