          )

          replace_once(
              '  int minutes = server.hasArg("minutes") ? server.arg("minutes").toInt() : 0;\n  const char* timeText = server.hasArg("time") ? server.arg("time").c_str() : "";',
              '  int minutes = server.hasArg("minutes") ? server.arg("minutes").toInt() : 0;\n  const char* timeText = server.hasArg("time") ? server.arg("time").c_str() : "";\n  String daysText = server.hasArg("days") ? server.arg("days") : "All";',
              'local add schedule days input'
          )

          replace_once(
