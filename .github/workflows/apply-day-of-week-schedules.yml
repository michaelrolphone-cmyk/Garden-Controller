          )

          replace_once(
              'controls.add("syncTime"); controls.add("manualRun"); controls.add("stopZone"); controls.add("spigotRun"); controls.add("setRelay"); controls.add("allOff"); controls.add("buzzerTest"); controls.add("factoryReset");',
              'controls.add("syncTime"); controls.add("manualRun"); controls.add("stopZone"); controls.add("spigotRun"); controls.add("setRelay"); controls.add("allOff"); controls.add("buzzerTest"); controls.add("factoryReset"); controls.add("scheduleWeekdays");',
